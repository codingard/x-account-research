<!doctype html><html lang="en"><meta charset="utf-8"><title>X Account Research</title>
<style>body{font:14px system-ui;width:340px;padding:16px;color:#202020}input,button,select{box-sizing:border-box;width:100%;padding:10px;margin:5px 0}button{cursor:pointer}pre{white-space:pre-wrap;font:13px system-ui;background:#f2f3f5;padding:12px}small{display:block;line-height:1.5;color:#555}</style>
<h2>Download X posts</h2><label>Profile URL<input id="url" placeholder="https://x.com/name"></label><label>Maximum posts<input id="limit" type="number" min="1" max="100" value="40"></label>
<label>Recent days (0 = no cutoff)<input id="days" type="number" min="0" max="365" value="14"></label>
<button id="start">Collect in new tab</button><button id="pause">Pause</button><button id="resume">Resume</button><button id="preflight">Save metadata for size estimate</button><label>Media<select id="mode"><option value="best">All media, best quality</option><option value="balanced">All media, lighter video</option><option value="images">Images only</option><option value="none">Data and links only</option></select></label><button id="export">Download dataset and media</button><pre id="status">Loading…</pre><small>Keep the collection tab visible. Data stays in this browser. Collection pauses on login checks or X restrictions. Exports are saved to Downloads/x-research.</small><script src="popup.js"></script></html>
